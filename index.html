<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- The Inter capital "E" is declared in src/index.css (with a
         size-adjust so it matches Montserrat's capitals). -->
    <title>ESM | Luxury, Defined By Every Ride</title>
    <!-- Tab icon: the ESM logo in teal on black (SVG, with PNG fallbacks for
         browsers without SVG favicons and for iOS) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply saved theme before paint to avoid a flash. Default: dark.
      (function () {
        try {
          var t = localStorage.getItem("esm-theme");
          if (t === "light") document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
